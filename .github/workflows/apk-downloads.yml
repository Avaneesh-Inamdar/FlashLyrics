name: Refresh APK download counter

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-download-counter
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Count public release APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_apk_downloads.py
      - name: Commit changed count
        run: |
          git add docs/apk-downloads.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh APK download count'
          git pull --rebase origin main
          git push origin HEAD:main
